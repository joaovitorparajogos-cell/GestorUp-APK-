name: Publish Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Release APK and Checksum
        run: |
          APK_PATH="apk-distribution/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="apk-distribution/GestorUp.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK file not found!"
            exit 1
          fi

          if [ -z "$(find "$APK_PATH" -type f -size +0)" ]; then
            echo "::error::APK file is empty!"
            exit 1
          fi

          # Verify zip structure
          unzip -tq "$APK_PATH"
          if [ $? -ne 0 ]; then
            echo "::error::Invalid APK zip structure!"
            exit 1
          fi

          if [ -f "${APK_PATH}.sha256" ]; then
            sha256sum -c "${APK_PATH}.sha256"
            if [ $? -ne 0 ]; then
              echo "::error::Checksum validation failed!"
              exit 1
            fi
          fi

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.3-release-${{ github.run_number }}"
          
          APK_FILE="apk-distribution/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE="apk-distribution/GestorUp.apk"
          fi

          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK file not found!"
            exit 1
          fi

          # 1. Create release if it doesn't already exist (without invalid --clobber flag)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "GestorUp v1.3 (Build ${{ github.run_number }})" \
              --notes "Compilação oficial de release assinada do aplicativo GestorUp." \
              --latest
          fi

          # 2. Upload APK asset using gh release upload with --clobber
          echo "Uploading $APK_FILE to release $TAG_NAME..."
          gh release upload "$TAG_NAME" "$APK_FILE" --clobber

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Report
        run: |
          echo "### APK Publication Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** ${{ env.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Public Download Fallback (Firebase Storage):** https://firebasestorage.googleapis.com/v0/b/gen-lang-client-0548980991.firebasestorage.app/o/public%2FGestorUp.apk?alt=media" >> $GITHUB_STEP_SUMMARY
